name: Release desktop

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-trigger/v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    if: github.repository == 'FelipePn10/app-venture'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate and synchronize version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME##*/}"
          version="${tag#v}"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          printf 'tag=v%s\n' "${version}" >>"${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"
          node scripts/set-release-version.mjs "${version}"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install and validate frontend
        shell: bash
        run: |
          npm ci
          npm run test:versioning
          npm run lint
          npm run build:production

      - name: Validate Rust host
        working-directory: src-tauri
        run: cargo test --locked

      - name: Extract release notes from CHANGELOG
        id: relnotes
        shell: bash
        run: |
          {
            echo 'body<<CHANGELOG_NOTES_EOF'
            node scripts/changelog-notes.mjs "${{ steps.version.outputs.tag }}"
            echo 'CHANGELOG_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create tag for remote release request
        if: startsWith(github.ref, 'refs/heads/release-trigger/')
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "ERP Venture ${tag}"
          git push origin "refs/tags/${tag}"

      - name: Build signed installers and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Atualizações mais seguras — ${{ steps.version.outputs.tag }}
          releaseBody: ${{ steps.relnotes.outputs.body }}
          releaseDraft: false
          # Tag com sufixo SemVer de pré-lançamento (v1.1.1-rc.1) publica como
          # prerelease. É o que impede que uma RC vire a "latest" do GitHub — o
          # updater dos clientes instalados lê
          # releases/latest/download/latest.json, e esse endpoint ignora
          # prereleases. Sem isso, qualquer tag de teste seria oferecida a todo
          # mundo que já tem o app instalado.
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          args: --bundles nsis,msi
